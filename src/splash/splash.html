<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
  <title>WhatsNexus - Loading</title>
  <link rel="stylesheet" href="splash.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="splash-card">
    <div class="splash-brand">
      <div class="logo-wrapper">
        <img src="../assets/whatsnexus-logo.svg" alt="WhatsNexus" class="brand-logo">
        <div class="logo-pulse"></div>
      </div>
      <div class="brand-text">
        <div class="brand-title-row">
          <h1 class="brand-title">WhatsNexus</h1>
          <span class="version-badge" id="version-badge"></span>
        </div>
        <p class="brand-tagline">Multi-Session WhatsApp Desktop</p>
      </div>
    </div>

    <div class="splash-progress-section">
      <div class="status-row">
        <span class="status-text" id="status-text">Initializing application components...</span>
        <span class="percentage-text" id="percentage-text">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script src="splash.js"></script>
</body>
</html>
