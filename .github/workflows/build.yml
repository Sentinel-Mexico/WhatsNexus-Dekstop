name: Build & Release Multiplataforma

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del proyecto
        run: |
          npm install || npm ci
          npm install --save-dev electron-builder

      # En Ubuntu 24.04 aislamos deb822 y apuntamos arm64 estrictamente a ports.ubuntu.com
      - name: Dependencias de compilación para Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo dpkg --add-architecture arm64
          # Si existe el nuevo formato deb822 de Ubuntu 24.04, restringir a amd64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/Architectures: .*/Architectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources || true
            if ! grep -q "Architectures:" /etc/apt/sources.list.d/ubuntu.sources; then
              sudo sed -i '/Suites:/i Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            fi
          fi
          # Si existe el archivo clásico sources.list, restringir a amd64
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list || true
          fi
          
          # Crear lista exclusiva de ports.ubuntu.com para ARM64
          sudo tee /etc/apt/sources.list.d/arm64-ports.list << 'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main restricted universe multiverse
          EOF

          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Compilar y Desplegar (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux deb AppImage --x64 --arm64 --publish always

      - name: Compilar y Desplegar (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --x64 --arm64 --publish always

      - name: Compilar y Desplegar (Windows)
        if: startsWith(matrix.os, 'windows')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always